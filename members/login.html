<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login | Taunet Nelel</title>
  <link rel="canonical" href="auth.html?tab=signin">
  <script>
    (function () {
      var q = window.location.search || '';
      var h = window.location.hash || '';
      var params = new URLSearchParams(q);
      if (!params.has('tab') && !params.has('mode')) params.set('tab', 'signin');
      window.location.replace('auth.html?' + params.toString() + h);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=auth.html?tab=signin">
</head>
<body>
  <p style="font-family:system-ui;padding:2rem;text-align:center">
    <a href="auth.html?tab=signin">Continue to sign in</a>
  </p>
</body>
</html>
